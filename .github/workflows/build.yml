name: Build desktop apps

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: FuckOTone-linux
            separator: ":"
          - os: windows-latest
            artifact: FuckOTone-windows
            separator: ";"
          - os: macos-latest
            artifact: FuckOTone-macos
            separator: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: bash
        run: >-
          python -m PyInstaller --onefile --windowed
          --name FuckOTone
          --add-data "world.png${{ matrix.separator }}."
          --add-data "fuck.gif${{ matrix.separator }}."
          --add-data "furry.png${{ matrix.separator }}."
          main.py

      - name: Archive build
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" FuckOTone.exe
          else
            tar -czf "../${{ matrix.artifact }}.tar.gz" FuckOTone
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: FuckOTone-${{ matrix.os == 'windows-latest' && 'windows.zip' || matrix.os == 'macos-latest' && 'macos.tar.gz' || 'linux.tar.gz' }}
